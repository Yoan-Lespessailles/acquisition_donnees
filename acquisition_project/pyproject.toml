[project]
name = "acquisition-project"
version = "0.1.0"
description = "Application d'acquisition de donnees pour la lecture labiale phonetique."
readme = "acquisition/README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=12.0",
    "PySide6==6.11.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
build = ["PyInstaller>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["acquisition*", "utils*"]
exclude = ["corpus*"]
