[project]
name = "annotation-project"
version = "0.1.0"
description = "Application d'annotation automatique avec Montreal Forced Aligner."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["annotation*"]
